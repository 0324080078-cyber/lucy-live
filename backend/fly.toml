# Fly.io deployment config for the Lucy Live backend.
# Secrets are set out-of-band (never committed):
#   fly secrets set DECART_API_KEY=... RTMP_URL=rtmp://live.twitch.tv/app/KEY
app = "lucy-live-backend"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
